name: Build ESP32FlightRadar Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio intelhex

      - name: Fix FreeRTOS Headers and Platform Version
        run: |
          sed -i '1s/^/#include "freertos\/FreeRTOS.h"\n#include "freertos\/semphr.h"\n/' src/display/aircraft_layer.cpp
          sed -i '1s/^/#include "freertos\/FreeRTOS.h"\n#include "freertos\/task.h"\n/' src/display/ui.cpp
          sed -i 's/platform = espressif32.*/platform = espressif32@6.5.0/' platformio.ini

      - name: Build PlatformIO Project
        run: pio run

      - name: Upload Firmware Binary
        uses: actions/upload-artifact@v4
        with:
          name: ESP32FlightRadar-Firmware
          path: .pio/build/*/firmware.bin
