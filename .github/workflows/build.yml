name: Build ESP32FlightRadar Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio intelhex

      - name: Patch C++ Source Files
        run: |
          sed -i '1s/^/#include "freertos\/FreeRTOS.h"\n#include "freertos\/semphr.h"\n/' src/display/aircraft_layer.cpp
          sed -i '1s/^/#include "freertos\/FreeRTOS.h"\n#include "freertos\/task.h"\n/' src/display/ui.cpp
          python3 -c '
path = "src/main.cpp"
with open(path, "r") as f:
    content = f.read()
import re
new_func = "const char* reset_reason_to_str(esp_reset_reason_t r) { return \"UNKNOWN\"; }"
content = re.sub(r"const char\*\s+reset_reason_to_str\([^)]*\)\s*\{[^}]*\}", new_func, content, flags=re.DOTALL)
with open(path, "w") as f:
    f.write(content)
'

      - name: Build PlatformIO Project
        run: pio run

      - name: Upload Firmware Binary
        uses: actions/upload-artifact@v4
        with:
          name: ESP32FlightRadar-Firmware
          path: .pio/build/*/firmware.bin
